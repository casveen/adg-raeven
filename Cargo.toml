[workspace]

resolver = "2"

members = [
  "src/plugins/core"

, "src/example-copies/scene3d-test"
, "src/gameplay"
, "src/ant-demo"
]

[workspace.dependencies]
bevy = "0.15.0"
bevy-inspector-egui = "0.29.1"
bevy_framepace = "0.18.0"
avian3d = "0.2.0"
blenvy = { git = "https://github.com/ptsd/Blenvy.git", branch = "blenvy-bevy-0.15" }

core = { path = "src/plugins/core" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

